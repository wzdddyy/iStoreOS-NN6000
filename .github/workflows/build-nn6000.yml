name: istoreos-nn6000 build

on:
  workflow_dispatch:
    inputs:
      istoreos_ref:
        description: "iStoreOS git ref (branch/tag) to build on"
        required: true
        default: "istoreos-25.12"
      publish_release:
        description: "Publish firmware as a GitHub Release after a successful build"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build NN6000 v2 firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      ISTOREOS_BRANCH: ${{ github.event.inputs.istoreos_ref }}
      CCACHE_DIR: ${{ github.workspace }}/istoreos/.ccache
      CCACHE_MAXSIZE: 1G

    steps:
      - name: Checkout port repository
        uses: actions/checkout@v6.0.2

      - name: Fetch iStoreOS source
        run: |
          set -o pipefail
          REF="${{ github.event.inputs.istoreos_ref }}"
          echo "Cloning iStoreOS ref: $REF"
          git clone --depth 1 -b "$REF" https://github.com/istoreos/istoreos.git "$GITHUB_WORKSPACE/istoreos"

      - name: Collect build info
        id: info
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget swig \
            ccache
          sudo apt-get clean

      - name: Restore ccache
        uses: actions/cache@v6.1.0
        with:
          path: istoreos/.ccache
          key: ccache-${{ runner.os }}-${{ steps.info.outputs.commit_hash }}-${{ hashFiles('config/nn6000.seed') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ steps.info.outputs.commit_hash }}-
            ccache-${{ runner.os }}-

      - name: Restore downloaded sources (dl/)
        uses: actions/cache@v6.1.0
        with:
          path: istoreos/dl
          key: dl-${{ runner.os }}-${{ steps.info.outputs.commit_hash }}
          restore-keys: |
            dl-${{ runner.os }}-

      - name: Restore toolchain (cross-compiler)
        uses: actions/cache@v6.1.0
        with:
          path: |
            istoreos/staging_dir/toolchain-*
            istoreos/build_dir/toolchain-*
          key: toolchain-${{ runner.os }}-${{ steps.info.outputs.commit_hash }}
          restore-keys: |
            toolchain-${{ runner.os }}-

      - name: Apply NN6000 port
        run: |
          set -o pipefail
          sh scripts/apply-nn6000.sh "$GITHUB_WORKSPACE/istoreos"

      - name: Update and install feeds
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          set -o pipefail
          ./scripts/feeds update -a
          # luci-app-dockerman / luci-lib-docker are vendored in-tree under
          # package/ (lisaac originals). Drop the luci feed copies to avoid
          # duplicate package definitions, then regenerate the feed indexes
          # so install never resolves against the deleted paths.
          rm -rf feeds/luci/applications/luci-app-dockerman feeds/luci/libs/luci-lib-docker
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      - name: Patch luci rpcd for CPU info & temperature
        run: |
          set -o pipefail
          sh scripts/patch_luci.sh "$GITHUB_WORKSPACE/istoreos"

      - name: Configure (.config seed + defconfig)
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          set -o pipefail
          cat "$GITHUB_WORKSPACE/config/nn6000.seed" > .config
          make defconfig
          echo "::group::Selected device symbols"
          grep -E '^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)|DEVICE_link_nn6000' .config || true
          echo "::endgroup::"
          echo "::group::ccache config"
          grep -E '^CONFIG_(DEVEL|CCACHE)' .config || true
          echo "::endgroup::"

      - name: Verify target device is selected
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          set -o pipefail
          FAIL=0
          if grep -q '^CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_link_nn6000-v2=y' .config; then
            echo "::notice::device selected: link_nn6000-v2"
          else
            echo "::error::device link_nn6000-v2 was not selected by defconfig"
            grep -o 'TARGET_qualcommax_ipq60xx_DEVICE_[a-z0-9_.-]*' tmp/.config-target.in 2>/dev/null | sort -u || true
            FAIL=1
          fi
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y' .config \
            || { echo "::error::initramfs image is disabled; TFTP first-install image will be missing"; FAIL=1; }
          exit $FAIL

      - name: Verify UI stack survived defconfig
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          # defconfig silently drops packages with unsatisfied dependencies.
          # Fail fast here instead of building firmware with no web UI.
          HARD="
          luci-app-store
          quickstart
          luci-app-quickstart
          luci-i18n-quickstart-zh-cn
          taskd
          luci-lib-taskd
          luci-lib-xterm
          mount-utils
          block-mount
          lsblk
          parted
          luci
          luci-app-firewall
          luci-theme-argon
          luci-app-dockerman
          luci-lib-docker
          docker
          dockerd
          ttyd
          luci-app-ttyd
          kmod-tun
          kmod-qca-nss-drv
          kmod-qca-nss-ecm
          kmod-qca-nss-crypto
          kmod-pppoe
          kmod-macvlan
          nss-firmware-ipq60xx
          nss-eip-firmware
          "
          MISSING=""
          for p in $HARD; do
            if grep -q "^CONFIG_PACKAGE_${p}=y" .config; then
              echo "  ok      $p"
            else
              echo "  MISSING $p"
              MISSING="$MISSING $p"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "::error::Required packages were dropped by defconfig:$MISSING"
            exit 1
          fi

      - name: Pre-download sources
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          set -o pipefail
          make download -j8 || make download -j1 V=s
          find dl -size -1024c -type f -exec rm -f {} \; || true
          make download -j8 || true

      - name: Build firmware
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          set -o pipefail
          echo "Starting build, parallel jobs: $(nproc)"
          if ! make -j"$(nproc)" 2>&1 | tee build.log; then
            echo "::warning::Parallel build failed, retrying single-threaded with V=s"
            make -j1 V=s 2>&1 | tee -a build.log
          fi
          echo "::group::ccache stats"
          ccache -s || true
          echo "::endgroup::"

      - name: Verify artifacts
        working-directory: ${{ github.workspace }}/istoreos
        run: |
          set -o pipefail
          OUT=bin/targets/qualcommax/ipq60xx
          echo "::group::Artifact listing"
          ls -lh "$OUT"
          echo "::endgroup::"
          FAIL=0
          for kind in factory sysupgrade initramfs; do
            if ls "$OUT"/*link_nn6000-v2*${kind}* >/dev/null 2>&1; then
              echo "  ok      link_nn6000-v2 $kind"
            else
              echo "::error::missing $kind image for link_nn6000-v2"
              FAIL=1
            fi
          done
          [ $FAIL -eq 0 ] || exit 1

          M=$(ls "$OUT"/*link_nn6000-v2*.manifest 2>/dev/null | head -1)
          [ -n "$M" ] || { echo "::error::no manifest for link_nn6000-v2"; exit 1; }
          echo "::group::Manifest check: link_nn6000-v2"
          for pkg in ipq-wifi-link_nn6000 quickstart luci-app-quickstart dockerd luci-app-dockerman luci-lib-docker f2fs-tools kmod-fs-f2fs kmod-ath11k-ahb kmod-qca-nss-drv kmod-qca-nss-ecm kmod-qca-nss-crypto kmod-pppoe kmod-macvlan nss-firmware-ipq60xx nss-eip-firmware; do
            if grep -q "^${pkg} " "$M"; then
              echo "  ok      $pkg"
            else
              echo "::error::package $pkg missing from v2 image"
              FAIL=1
            fi
          done
          echo "::endgroup::"
          exit $FAIL

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: istoreos/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Generate release timestamp
        id: ts
        if: success()
        run: |
          echo "tag=rel-nn6000-$(TZ=Asia/Shanghai date +%Y%m%d-%H%M)" >> "$GITHUB_OUTPUT"
          echo "human=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Stage release artifacts with date prefix
        if: success() && inputs.publish_release
        run: |
          set -o pipefail
          SRC="istoreos/bin/targets/qualcommax/ipq60xx"
          DST="release-artifacts"
          DATE="${{ steps.ts.outputs.date }}"
          mkdir -p "$DST"
          for f in "$SRC"/*link_nn6000-v2*.bin "$SRC"/*link_nn6000-v2*.itb "$SRC"/*link_nn6000-v2*.manifest; do
            [ -e "$f" ] || continue
            cp "$f" "$DST/${DATE}-$(basename "$f")"
          done
          ls -lh "$DST"

      - name: Publish release
        if: success() && inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ts.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: iStoreOS Link NN6000 v2 固件 ${{ steps.ts.outputs.human }}
          files: |
            release-artifacts/*
          body: |
            ## iStoreOS Link NN6000 v2 固件

            - **目标设备**: Link NN6000 v2
            - **平台**: qualcommax/ipq60xx (ipq6000)
            - **iStoreOS 分支**: ${{ env.ISTOREOS_BRANCH }}
            - **iStoreOS 提交**: ${{ steps.info.outputs.commit_hash }} (${{ steps.info.outputs.commit_date }})
            - **编译日期**: ${{ steps.info.outputs.build_date }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
